name: Akis testi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["araclar/test_linkleri.txt", "araclar/reklam_izle.py"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 araclar/reklam_izle.py
      - run: |
          git config user.name "hanimtv-derleyici"; git config user.email "actions@github.com"
          git checkout -B test-sonucu && git add -f sonuc.txt && git commit -qm "Test sonucu" && git push -f origin test-sonucu
