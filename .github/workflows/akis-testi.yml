name: Akis testi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["araclar/test_linkleri.txt"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq install -y ffmpeg >/dev/null
      - run: bash araclar/akis_testi.sh < araclar/test_linkleri.txt > sonuc.txt 2>&1; cat sonuc.txt
      - run: |
          git config user.name "hanimtv-derleyici"; git config user.email "actions@github.com"
          git checkout -B test-sonucu && git add -f sonuc.txt && git commit -qm "Test sonucu" && git push -f origin test-sonucu
