# Yayın akışını (şimdi ne var / sırada ne var) 6 saatte bir ücretsiz kaynaklardan toplar.
name: Yayin akisi

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "araclar/epg.py"
      - ".github/workflows/epg.yml"

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: true

jobs:
  akis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Akışı topla
        run: python3 araclar/epg.py
      - name: Kaydet
        run: |
          git config user.name "hanimtv-derleyici"
          git config user.email "actions@github.com"
          git add epg.json
          git commit -m "Yayın akışı" || exit 0
          git pull --rebase -q && git push
